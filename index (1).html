function panel(){
 var w=$("pn");if(w)w.remove();
 w=document.createElement("div");w.id="pn";document.body.appendChild(w);
 function wire(){$("pc").onclick=function(){w.remove()};var d=$("del");if(d)d.onclick=function(){try{localStorage.removeItem("asesmen_gh_token")}catch(e){}panel()}}
 if(!gtok()){
  w.innerHTML='<div class="card"><h1>Setting</h1><p class="mu">Tempel token GitHub milikmu. Cukup sekali, dan token hanya disimpan di HP ini.</p><input id="tk" placeholder="github_pat_..." autocomplete="off"><div class="err" id="pe"></div><button class="pri" id="tks">Simpan token</button>'+closeBtn()+'</div>';wire();
  $("tks").onclick=function(){var v=$("tk").value.trim();if(!v){msg("Token belum diisi.",false);return}try{localStorage.setItem("asesmen_gh_token",v)}catch(e){msg("Browser menolak menyimpan token.",false);return}panel()};return}
 w.innerHTML='<div class="card"><h1>Setting</h1><p class="mu" id="pe">Memuat pengaturan terbaru...</p>'+closeBtn()+'</div>';wire();
 api("GET").then(function(j){gp.sha=j.sha;gp.text=b64d(j.content);gp.cfg=JSON.parse(gp.text.match(CFGRE)[2]);form()}).catch(function(e){fail(e);w.querySelector(".card").insertAdjacentHTML("beforeend",'<button class="opt" id="del" style="margin-top:8px;text-align:center">Hapus token</button>');wire()});
 function form(){
  var h='<div class="card"><h1>Setting</h1><p class="mu">Atur kelas yang dibuka dan kodenya, lalu tekan Simpan. Perubahan aktif sekitar 1 sampai 10 menit setelah disimpan. Siswa yang sedang mengerjakan tidak terganggu.</p>';
  Object.keys(gp.cfg.kelas).forEach(function(k){var c=gp.cfg.kelas[k];h+='<div class="rv"><b style="color:var(--tx)">Kelas '+k+'</b><label><input type="checkbox" data-k="'+k+'"'+(c.on?' checked':'')+'>Dibuka untuk siswa</label>Kode:<input data-c="'+k+'" value="'+esc(c.kode)+'"></div>'});
  h+='<p class="mu">Sesi ke-'+gp.cfg.sesi+'</p><label class="mu"><input type="checkbox" id="ns">Mulai sesi baru (siswa boleh mengerjakan lagi)</label><div class="err" id="pe" style="margin-top:10px"></div><button class="pri" id="ps">Simpan</button>'+closeBtn()+'<button class="opt" id="del" style="margin-top:8px;text-align:center">Hapus token dari HP ini</button></div>';
  w.innerHTML=h;wire();
  $("ps").onclick=function(){
   var nc=JSON.parse(JSON.stringify(gp.cfg)),cs=[];
   Object.keys(nc.kelas).forEach(function(k){nc.kelas[k].on=w.querySelector('[data-k="'+k+'"]').checked;nc.kelas[k].kode=w.querySelector('[data-c="'+k+'"]').value.trim();cs.push(nc.kelas[k].kode.toUpperCase())});
   if(cs.some(function(x){return !x})){msg("Kode tidak boleh kosong.",false);return}
   if(new Set(cs).size<cs.length){msg("Kode tiap kelas harus berbeda.",false);return}
   if($("ns").checked)nc.sesi++;
   var nt=gp.text.replace(CFGRE,function(m,a,b,c){return a+JSON.stringify(nc)+c});
   msg("Menyimpan...",true);$("ps").disabled=true;
   api("PUT",{message:"Ubah pengaturan kelas",content:b64e(nt),sha:gp.sha}).then(function(j){gp.sha=j.content.sha;gp.text=nt;gp.cfg=nc;$("ns").checked=false;$("ps").disabled=false;msg("Tersimpan. Akan aktif dalam beberapa menit.",true)}).catch(function(e){$("ps").disabled=false;fail(e)})}}
}
var tc=0,tt=0;
if(/github\.io$/.test(location.hostname))document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest("h1")||e.target.closest("#pn"))return;var n=Date.now();if(n-tt>3000)tc=0;tt=n;if(++tc>=5){tc=0;panel()}});
var prev=load();
if(prev&&prev.order){st=prev;i=prev.pos||0;if(!st.done){for(var z=i;z<Q.length;z++)st.ans[st.order[z]]=st.ans[st.order[z]]||null;i=Q.length}finish()}else start();
</script></body></html>
