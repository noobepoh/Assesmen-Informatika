</style></head><body><div id="app"></div>

"on": true  = kelas dibuka, siswa bisa masuk.
"on": false = kelas ditutup.
"kode" = kode yang dibagikan ke kelas itu (harus berbeda tiap kelas).
"sesi": naikkan angkanya (2 menjadi 3, dst) agar semua siswa bisa mengerjakan ulang.
Jangan mengubah tanda kutip, koma, atau kurung kurawal.
-->

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function shuf(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}return a}
function dia(k){
 function r(x,y,w,h,f,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" style="fill:'+f+'" stroke="#0005" stroke-width=".8"/>'}
 function c(x,y,q,f){return '<circle cx="'+x+'" cy="'+y+'" r="'+q+'" style="fill:'+f+'" stroke="#0005" stroke-width=".8"/>'}
 var s='',j;
 if(k=='cpu'){s=r(70,20,100,100,'#2e3340',8)+r(88,38,64,64,'#cfd3da',4)+r(96,46,48,48,'#b4b9c2',3);

 else if(k=='ram'){s=r(12,42,216,52,'#2f8f4e',3);
  for(j=0;j<4;j++)s+=r(28+j*48,50,40,28,'#22252b',2);
  for(j=0;j<34;j++)s+=r(16+j*6.2,94,4,9,'#e2b93b');
  s+=r(114,92,7,13,'#e9ecf2')}
 else if(k=='mb'){s=r(28,6,184,128,'#2a6b4f',4)+r(104,26,46,46,'#d5d8de',3)+r(112,34,30,30,'#a9aeb8',2)+r(66,48,28,28,'#8b909a',2);
  for(j=0;j<4;j++)s+=r(164+j*11,18,7,74,'#20232a',1);
  s+=r(44,96,110,7,'#20232a',1)+r(44,110,110,7,'#20232a',1)+r(44,122,60,5,'#20232a',1)+r(170,104,30,14,'#f0f0f0',1);
  for(j=0;j<3;j++)s+=r(32,16+j*22,16,18,'#b9bec7',1)+c(62+j*12,24,4.5,'#8a8f99')}
 else if(k=='hdd'){s=r(36,10,168,120,'#b7bbc3',8)+c(108,70,50,'#dfe2e8')+c(108,70,22,'#c3c7cf')+c(108,70,7,'#4a4e57')+'<line x1="180" y1="118" x2="124" y2="86" stroke="#4a4e57" stroke-width="6" stroke-linecap="round"/>'+c(180,118,7,'#6b707a');
  [[46,20],[194,20],[46,120],[194,120]].forEach(function(p){s+=c(p[0],p[1],3,'#7a7f89')})}
 else{s=r(22,28,196,84,'#2f7d59',5);
  for(j=0;j<2;j++)s+=r(42,40+j*32,34,24,'#22252b',2)+r(84,40+j*32,34,24,'#22252b',2);
  s+=r(128,50,32,32,'#3a3f4a',3)+r(196,50,20,40,'#20232a',2);
  for(j=0;j<7;j++)s+=r(200,54+j*5,12,3,'#e2b93b')}
 return '<svg viewBox="0 0 240 140" role="img" aria-label="Gambar komponen komputer">'+s+'</svg>'}
function start(){
 var ks=Object.keys(CFG.kelas);
 app.innerHTML='<div class="card"><h1>Asesmen Bab 4: Sistem Komputer</h1><p class="mu">'+Q.length+' soal pilihan ganda. Tiap soal punya batas waktu sendiri, tidak bisa kembali ke soal sebelumnya, dan hanya bisa dikerjakan satu kali.</p>'+
 '<label>Kelas</label><select id="kl">'+ks.map(function(k){return '<option>'+k+'</option>'}).join('')+'</select><label>Nama / NIS</label><input id="nm" autocomplete="off"><label>Kode dari guru</label><input id="kd" autocomplete="off" autocapitalize="characters"><div class="err" id="er"></div><button class="pri" id="go">Mulai</button></div>';
 $("go").onclick=function(){
  var c=$("kl").value,n=$("nm").value.trim(),k=$("kd").value.trim().toUpperCase(),cf=CFG.kelas[c];
  if(!cf.on){$("er").textContent="Asesmen kelas "+c+" belum dibuka oleh guru.";return}
  if(!n){$("er").textContent="Isi nama atau NIS dulu.";return}
  if(k!==cf.kode.toUpperCase()){$("er").textContent="Kode salah. Tanyakan kepada gurumu.";return}
  st={name:n,kls:c,order:shuf(Q.map(function(_,j){return j})),ans:{},pos:0,done:false,sw:0};i=0;save();show()}}
function show(){
 if(i>=Q.length)return finish();
 var q=Q[st.order[i]],t=T[q[2]],end=Date.now()+t*1000;sel=null;cur=q;
 var o=shuf(q[1]);
 app.innerHTML='<div class="top"><span>Soal '+(i+1)+' / '+Q.length+'</span><span id="tm">'+t+'</span></div><div class="bar"><i id="bf"></i></div><div class="card"><p>'+q[0]+'</p>'+(q[3]?dia(q[3]):'')+
 '<div id="op">'+o.map(function(x,j){return '<button class="opt" data-j="'+j+'">'+esc(x)+'</button>'}).join('')+'</div><button class="pri" id="nx">'+(i==Q.length-1?'Selesai':'Lanjut')+'</button></div>';
 var bs=app.querySelectorAll(".opt");
 bs.forEach(function(b){b.onclick=function(){bs.forEach(function(x){x.classList.remove("on")});b.classList.add("on");sel=o[+b.dataset.j]}});
 $("nx").onclick=nextQ;
 clearInterval(iv);
 iv=setInterval(function(){var l=Math.max(0,Math.ceil((end-Date.now())/1000));$("tm").textContent=l;$("tm").className=l<=5?"lo":"";$("bf").style.width=Math.max(0,(end-Date.now())/(t*10))+"%";if(l<=0)nextQ()},250)}
function nextQ(){clearInterval(iv);st.ans[st.order[i]]=sel;i++;st.pos=i;save();show()}
function finish(){
 clearInterval(iv);st.done=true;save();
 var sc=0,rv='';
 st.order.forEach(function(j){var q=Q[j],a=st.ans[j];if(a===q[1][0])sc++;else rv+='<div class="rv">'+q[0]+'<br>Jawabanmu: <s>'+esc(a||'(kosong)')+'</s><br>Yang benar: <b>'+esc(q[1][0])+'</b></div>'});
 var nilai=Math.round(sc/Q.length*100);
 app.innerHTML='<div class="card"><h1>Selesai, '+esc(st.name)+' ('+esc(st.kls||'')+')</h1><div class="big">'+nilai+'</div><p style="text-align:center">Benar '+sc+' dari '+Q.length+' soal</p><p class="mu" style="text-align:center">Tunjukkan layar ini kepada gurumu. Asesmen tidak bisa dibuka lagi.'+(st.sw?' Keluar dari halaman: '+st.sw+' kali.':'')+'</p></div>'+
 (rv?'<div class="card"><b>Pembahasan jawaban yang salah</b>'+rv+'</div>':'')}
document.addEventListener("visibilitychange",function(){if(document.hidden&&st&&!st.done){st.sw=(st.sw||0)+1;save()}});
function panel(){
 var w=$("pn");if(w)w.remove();
 w=document.createElement("div");w.id="pn";
 var h='<div class="card"><h1>Setting</h1><p class="mu">Atur kelas yang dibuka dan kodenya, lalu tekan Simpan &amp; Terbitkan. Halaman siswa yang sedang terbuka akan dimuat ulang, jadi lakukan saat tidak ada yang mengerjakan.</p>';
 Object.keys(CFG.kelas).forEach(function(k){var c=CFG.kelas[k];h+='<div class="rv"><b style="color:var(--tx)">Kelas '+k+'</b><label><input type="checkbox" data-k="'+k+'"'+(c.on?' checked':'')+'>Dibuka untuk siswa</label>Kode:<input data-c="'+k+'" value="'+esc(c.kode)+'"></div>'});
 h+='<p class="mu">Sesi ke-'+CFG.sesi+'</p><label class="mu"><input type="checkbox" id="ns">Mulai sesi baru (siswa boleh mengerjakan lagi)</label><div class="err" id="pe" style="margin-top:10px"></div><button class="pri" id="ps">Simpan &amp; Terbitkan</button><button class="opt" id="pc" style="margin-top:8px;text-align:center">Tutup</button></div>';
 w.innerHTML=h;document.body.appendChild(w);
 $("pc").onclick=function(){w.remove()};
 $("ps").onclick=async function(){
  var nc=JSON.parse(JSON.stringify(CFG)),ks=Object.keys(nc.kelas),cs=[];
  ks.forEach(function(k){nc.kelas[k].on=w.querySelector('[data-k="'+k+'"]').checked;nc.kelas[k].kode=w.querySelector('[data-c="'+k+'"]').value.trim();cs.push(nc.kelas[k].kode.toUpperCase())});
  if(cs.some(function(x){return !x})){$("pe").textContent="Kode tidak boleh kosong.";return}
  if(new Set(cs).size<cs.length){$("pe").textContent="Kode tiap kelas harus berbeda.";return}
  if($("ns").checked)nc.sesi++;
